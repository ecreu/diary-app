<!-- =========================================================
MOBILE PIN LOCK SYSTEM FIX
모바일 PIN 잠금 전체 교체용 코드
기존 PIN 관련 HTML/CSS/JS 제거 후 적용
========================================================= -->

<!-- =========================================================
LOCK SCREEN
========================================================= -->

<div
  class="lock-screen"
  id="lockScreen"
>

  <div class="lock-backdrop"></div>

  <div class="lock-panel glass">

    <div class="lock-logo">
      🌙
    </div>

    <h2 id="lockTitle">
      하루 일기
    </h2>

    <p
      class="lock-description"
      id="lockDescription"
    >
      PIN 번호를 입력하세요
    </p>

    <!-- PIN DOT -->

    <div
      class="pin-dots"
      id="pinDots"
    >

      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>

    </div>

    <!-- KEYPAD -->

    <div
      class="pin-keypad"
      id="pinKeypad"
    >

      <button class="pin-key" data-key="1">1</button>
      <button class="pin-key" data-key="2">2</button>
      <button class="pin-key" data-key="3">3</button>

      <button class="pin-key" data-key="4">4</button>
      <button class="pin-key" data-key="5">5</button>
      <button class="pin-key" data-key="6">6</button>

      <button class="pin-key" data-key="7">7</button>
      <button class="pin-key" data-key="8">8</button>
      <button class="pin-key" data-key="9">9</button>

      <div></div>

      <button class="pin-key" data-key="0">0</button>

      <button
        class="
          pin-key
          delete-key
        "
        data-action="delete"
      >
        ⌫
      </button>

    </div>

  </div>

</div>

<style>

/* =========================================================
LOCK SCREEN
========================================================= */

.lock-screen{

  position:fixed;

  inset:0;

  width:100%;
  height:100dvh;

  display:flex;

  justify-content:center;
  align-items:center;

  z-index:999999;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #0f172a,
      #111827
    );

  transition:
    opacity .45s ease,
    visibility .45s ease;
}

/* =========================================================
BACKDROP
========================================================= */

.lock-backdrop{

  position:absolute;

  inset:0;

  backdrop-filter:
    blur(24px);

  -webkit-backdrop-filter:
    blur(24px);

  pointer-events:none;
}

/* =========================================================
PANEL
========================================================= */

.lock-panel{

  position:relative;

  width:92%;

  max-width:420px;

  border-radius:42px;

  padding:
    44px
    26px;

  display:flex;

  flex-direction:column;

  align-items:center;

  z-index:5;

  pointer-events:auto;
}

.lock-logo{

  font-size:56px;

  margin-bottom:18px;
}

#lockTitle{

  font-size:28px;

  margin-bottom:10px;
}

.lock-description{

  opacity:.72;

  margin-bottom:34px;

  text-align:center;
}

/* =========================================================
PIN DOTS
========================================================= */

.pin-dots{

  display:flex;

  gap:14px;

  margin-bottom:34px;
}

.pin-dot{

  width:18px;
  height:18px;

  border-radius:50%;

  background:
    rgba(255,255,255,.16);

  transition:
    transform .2s ease,
    background .2s ease;
}

.pin-dot.filled{

  background:white;

  transform:scale(1.12);
}

/* =========================================================
KEYPAD
========================================================= */

.pin-keypad{

  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:16px;

  position:relative;

  z-index:20;
}

.pin-key{

  min-height:72px;

  border:none;

  border-radius:26px;

  font-size:26px;

  color:white;

  background:
    rgba(255,255,255,.08);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  box-shadow:
    0 10px 30px rgba(0,0,0,.22);

  transition:
    transform .12s ease,
    background .2s ease;

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;

  -webkit-tap-highlight-color:
    transparent;
}

.pin-key:active{

  transform:scale(.94);

  background:
    rgba(255,255,255,.16);
}

.delete-key{

  font-size:22px;
}

/* =========================================================
SHAKE
========================================================= */

.lock-panel.shake{

  animation:
    shake .45s ease;
}

@keyframes shake{

  0%{
    transform:translateX(0);
  }

  20%{
    transform:translateX(-10px);
  }

  40%{
    transform:translateX(10px);
  }

  60%{
    transform:translateX(-8px);
  }

  80%{
    transform:translateX(8px);
  }

  100%{
    transform:translateX(0);
  }

}

/* =========================================================
UNLOCK
========================================================= */

.lock-screen.unlock{

  opacity:0;

  visibility:hidden;

  pointer-events:none;

  backdrop-filter:
    blur(0px);
}

/* =========================================================
MOBILE SAFE
========================================================= */

@supports(height:100dvh){

  .lock-screen{

    height:100dvh;
  }

}

</style>

<script>

/* =========================================================
PIN LOCK SYSTEM
========================================================= */

const PIN_STORAGE_KEY =
  "diaryPin";

/* =========================================================
STATE
========================================================= */

let enteredPin = [];

let setupMode = false;

/* =========================================================
ELEMENTS
========================================================= */

const lockScreen =
  document.getElementById(
    "lockScreen"
  );

const pinDots =
  document.getElementById(
    "pinDots"
  );

const keypad =
  document.getElementById(
    "pinKeypad"
  );

const lockTitle =
  document.getElementById(
    "lockTitle"
  );

const lockDescription =
  document.getElementById(
    "lockDescription"
  );

/* =========================================================
LOAD PIN
========================================================= */

function getSavedPin(){

  return localStorage.getItem(
    PIN_STORAGE_KEY
  );

}

/* =========================================================
INIT
========================================================= */

function initPinLock(){

  const savedPin =
    getSavedPin();

  if(!savedPin){

    setupMode = true;

    lockDescription.innerText =
      "새로운 PIN 번호를 설정하세요";
  }

  else{

    setupMode = false;

    lockDescription.innerText =
      "PIN 번호를 입력하세요";
  }

  updateDots();
}

/* =========================================================
DOTS
========================================================= */

function updateDots(){

  const dots =
    pinDots.querySelectorAll(
      ".pin-dot"
    );

  dots.forEach((dot,index)=>{

    dot.classList.toggle(
      "filled",
      index < enteredPin.length
    );

  });

}

/* =========================================================
RESET
========================================================= */

function resetPin(){

  enteredPin = [];

  updateDots();
}

/* =========================================================
HANDLE INPUT
========================================================= */

function handlePinInput(value){

  if(enteredPin.length >= 4){

    return;
  }

  enteredPin.push(value);

  updateDots();

  if(enteredPin.length === 4){

    setTimeout(()=>{

      validatePin();

    },120);

  }

}

/* =========================================================
DELETE
========================================================= */

function deletePin(){

  enteredPin.pop();

  updateDots();
}

/* =========================================================
VALIDATE
========================================================= */

function validatePin(){

  const pin =
    enteredPin.join("");

  /* setup */

  if(setupMode){

    localStorage.setItem(
      PIN_STORAGE_KEY,
      pin
    );

    unlockApp();

    return;
  }

  /* validate */

  const savedPin =
    getSavedPin();

  if(pin === savedPin){

    unlockApp();
  }

  else{

    triggerError();
  }

}

/* =========================================================
ERROR
========================================================= */

function triggerError(){

  navigator.vibrate?.(180);

  const panel =
    document.querySelector(
      ".lock-panel"
    );

  panel.classList.add(
    "shake"
  );

  setTimeout(()=>{

    panel.classList.remove(
      "shake"
    );

  },450);

  resetPin();
}

/* =========================================================
UNLOCK
========================================================= */

function unlockApp(){

  lockScreen.classList.add(
    "unlock"
  );

  setTimeout(()=>{

    lockScreen.remove();

  },500);

}

/* =========================================================
KEYPAD EVENT
중요:
event delegation 사용
pointerdown + touch 대응
========================================================= */

function registerPinEvents(){

  if(!keypad) return;

  keypad.addEventListener(
    "pointerdown",
    handleKeypadInteraction,
    {
      passive:true
    }
  );

  keypad.addEventListener(
    "touchstart",
    handleKeypadInteraction,
    {
      passive:true
    }
  );

}

/* =========================================================
KEYPAD HANDLER
========================================================= */

function handleKeypadInteraction(event){

  const target =
    event.target.closest(
      ".pin-key"
    );

  if(!target){

    return;
  }

  target.style.transform =
    "scale(.92)";

  setTimeout(()=>{

    target.style.transform =
      "";

  },120);

  const action =
    target.dataset.action;

  if(action === "delete"){

    deletePin();

    return;
  }

  const value =
    target.dataset.key;

  if(value){

    handlePinInput(value);
  }

}

/* =========================================================
VISIBILITY FIX
화면 전환 후 이벤트 복구
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.visibilityState
      === "visible"
    ){

      registerPinEvents();
    }

  }
);

/* =========================================================
RESIZE FIX
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    document.body.style.height =
      window.innerHeight
      + "px";

  }
);

/* =========================================================
START
========================================================= */

initPinLock();

registerPinEvents();

</script>
