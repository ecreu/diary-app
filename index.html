<style>

/* =========================================================
COMMON.CSS
========================================================= */

:root{

  --bg:
    linear-gradient(
      145deg,
      #f7efe6,
      #eef2ff
    );

  --card:
    rgba(255,255,255,.18);

  --border:
    rgba(255,255,255,.24);

  --text:#111;

  --sub:#666;

  --blur:22px;

  --radius:28px;

  --shadow:
    0 10px 40px rgba(0,0,0,.08);

  --transition:
    .35s cubic-bezier(.22,1,.36,1);

}

body.dark{

  --bg:
    linear-gradient(
      145deg,
      #101216,
      #181b25
    );

  --card:
    rgba(255,255,255,.05);

  --border:
    rgba(255,255,255,.08);

  --text:#f3f3f3;

  --sub:#b5b5b5;

  --shadow:
    0 12px 45px rgba(0,0,0,.35);

}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:"Pretendard",sans-serif;

  background:var(--bg);

  color:var(--text);

  transition:
    background .5s ease,
    color .5s ease;

  overflow-x:hidden;
}

.glass{

  background:var(--card);

  backdrop-filter:
    blur(var(--blur));

  -webkit-backdrop-filter:
    blur(var(--blur));

  border:
    1px solid var(--border);

  box-shadow:var(--shadow);
}

.hidden{
  display:none !important;
}

.fade-up{

  animation:
    fadeUp .55s cubic-bezier(.22,1,.36,1);
}

@keyframes fadeUp{

  from{
    opacity:0;
    transform:
      translateY(18px);
  }

  to{
    opacity:1;
    transform:
      translateY(0);
  }

}

button,
input,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:none;
}

textarea{
  resize:none;
}

.section-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:16px;
}

.card{

  border-radius:var(--radius);

  padding:20px;
}

::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-thumb{
  background:
    rgba(255,255,255,.2);
  border-radius:999px;
}

/* =========================================================
MOBILE.CSS
========================================================= */

body.mobile{

  min-height:100vh;

  padding-bottom:120px;
}

.mobile-shell{

  width:100%;

  max-width:540px;

  margin:auto;

  padding:
    env(safe-area-inset-top)
    16px
    140px;
}

.mobile-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:22px;
}

.mobile-logo{

  font-size:28px;

  font-weight:700;
}

.mobile-page{

  display:none;
}

.mobile-page.active{
  display:block;
}

.mobile-diary-card{

  border-radius:34px;

  padding:24px;

  margin-bottom:20px;
}

.mobile-input{

  width:100%;

  border:none;

  outline:none;

  background:
    rgba(255,255,255,.28);

  border-radius:22px;

  padding:18px;

  margin-top:14px;

  color:var(--text);
}

.mobile-textarea{

  min-height:240px;

  line-height:1.9;

  font-size:15px;
}

.mobile-emotions{

  display:flex;

  gap:10px;

  overflow:auto;

  margin-top:18px;
}

.mobile-emotion{

  padding:12px 16px;

  border-radius:999px;

  min-width:max-content;

  transition:var(--transition);
}

.mobile-emotion.active{

  background:#111;

  color:white;

  transform:scale(1.05);
}

body.dark .mobile-emotion.active{

  background:white;

  color:#111;
}

.mobile-save{

  position:fixed;

  bottom:110px;

  right:20px;

  width:62px;
  height:62px;

  border-radius:50%;

  font-size:28px;

  z-index:999;

  transition:var(--transition);
}

.mobile-save:hover{

  transform:
    scale(1.06)
    translateY(-2px);
}

.mobile-feed{

  display:flex;

  flex-direction:column;

  gap:18px;
}

.mobile-post{

  border-radius:30px;

  padding:20px;

  animation:
    fadeUp .5s ease;
}

.mobile-post img{

  width:100%;

  border-radius:22px;

  margin-top:14px;
}

.mobile-tabbar{

  position:fixed;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  width:92%;

  max-width:520px;

  height:82px;

  border-radius:32px;

  display:flex;

  justify-content:space-around;

  align-items:center;

  z-index:9999;
}

.mobile-tab{

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:4px;

  width:64px;
  height:64px;

  border-radius:22px;

  color:var(--sub);

  transition:var(--transition);
}

.mobile-tab.active{

  background:
    rgba(255,255,255,.22);

  color:var(--text);

  transform:
    translateY(-8px);

  box-shadow:
    0 0 24px rgba(255,255,255,.18);
}

.mobile-calendar{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:10px;
}

.mobile-day{

  aspect-ratio:1/1;

  border-radius:18px;

  display:flex;

  justify-content:center;
  align-items:center;

  font-size:14px;

  position:relative;
}

.mobile-dot{

  width:7px;
  height:7px;

  border-radius:50%;

  position:absolute;

  bottom:10px;
}

.mobile-stats{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:14px;
}

.mobile-stat{

  padding:20px;

  border-radius:26px;

  text-align:center;
}

/* =========================================================
DESKTOP.CSS
========================================================= */

body.desktop{

  overflow:hidden;
}

.desktop-shell{

  width:100vw;
  height:100vh;

  padding:24px;

    280px

.desktop-sidebar{

  flex-direction:column;

  gap:20px;
}

.desktop-logo{

}

.desktop-menu{

  gap:12px;
}

.desktop-menu button{

  background:transparent;

  color:var(--text);

  transition:var(--transition);

  text-align:left;

  padding-left:18px;
}

.desktop-menu button:hover{

  background:
    rgba(255,255,255,.08);
}

.desktop-center{

  overflow:auto;

  display:flex;

  flex-direction:column;

  gap:22px;

  padding-right:8px;
}

.desktop-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:18px;
}

.desktop-panel{

  border-radius:34px;

  padding:24px;

  transition:var(--transition);
}

.desktop-panel:hover{

  transform:
    translateY(-4px);

  box-shadow:
    0 18px 45px rgba(0,0,0,.12);
}

.desktop-write textarea{

  height:220px;

  margin-top:16px;

  border:none;

  outline:none;

  border-radius:24px;

  padding:20px;

  background:

}

.desktop-feed{

  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));

  gap:18px;
}

.desktop-post{

  border-radius:30px;

  padding:20px;

  transition:var(--transition);

  position:relative;

  overflow:hidden;
}

.desktop-post:hover{

  transform:

}

.desktop-post::before{

}

.desktop-post img{

  width:100%;

  margin-top:14px;
}

.desktop-right{

  display:flex;

  flex-direction:column;

  gap:20px;

  overflow:auto;
}

.desktop-mini{

  border-radius:30px;

  padding:20px;
}

.desktop-calendar{

  display:grid;

    repeat(7,1fr);

  gap:10px;

.desktop-day{

  aspect-ratio:1/1;

  border-radius:18px;

  align-items:center;
  justify-content:center;

  position:relative;

  transition:var(--transition);
}

.desktop-day:hover{

}

.desktop-player{

</style>

<script>

/* =========================================================
COMMON DATA
========================================================= */

let diaries =

  JSON.parse(
    localStorage.getItem("diaries")
  ) || [];

let currentEmotion =
  "happy";

const emotionEmoji = {

  happy:"😊",
  normal:"😐",
  sad:"😢",
  angry:"😡"

};

/* =========================================================
PLATFORM DETECT
========================================================= */

function detectPlatform(){

  document.body.classList.remove(
    "mobile",
    "desktop"
  );

  if(window.innerWidth <= 768){

    document.body.classList.add(
      "mobile"
    );

    document
      .getElementById("mobileUI")
      .classList.remove("hidden");

    document
      .getElementById("desktopUI")
      .classList.add("hidden");

  }

  else{

    document.body.classList.add(
      "desktop"
    );

    document
      .getElementById("desktopUI")
      .classList.remove("hidden");

    document
      .getElementById("mobileUI")
      .classList.add("hidden");

  }

}

detectPlatform();

window.addEventListener(
  "resize",
  detectPlatform
);

/* =========================================================
THEME
========================================================= */

const savedTheme =
  localStorage.getItem("theme");

if(savedTheme === "dark"){

  document.body.classList.add("dark");

}

function toggleTheme(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "theme",
    document.body.classList.contains("dark")
    ? "dark"
    : "light"
  );

}

document
  .getElementById("themeToggleMobile")
  .onclick =
  toggleTheme;

/* =========================================================
SAVE LOGIC
========================================================= */

function generateSummary(text){

  if(
    text.includes("행복")
    ||
    text.includes("좋")
  ){

    return
      "오늘은 따뜻하고 행복한 하루였어요.";

  }

  if(
    text.includes("힘들")
    ||
    text.includes("슬프")
  ){

    return
      "조금 지쳤지만 의미 있는 하루였네요.";

  }

  return
    "소소하지만 편안한 하루를 보냈어요.";

}

function saveDiary(title,content){

  if(!content.trim()) return;

  diaries.unshift({

    id:Date.now(),

    title:
      title || "제목 없는 하루",

    content,

    emotion:currentEmotion,

    date:
      new Date()
        .toLocaleDateString("sv-SE"),

    summary:
      generateSummary(content)

  });

  localStorage.setItem(
    "diaries",
    JSON.stringify(diaries)
  );

  renderAll();

}

/* =========================================================
MOBILE UI JS
========================================================= */

document
  .querySelectorAll(
    ".mobile-emotion"
  )
  .forEach(btn=>{

    btn.onclick = ()=>{

      document
        .querySelectorAll(
          ".mobile-emotion"
        )
        .forEach(b=>{

          b.classList.remove(
            "active"
          );

        });

      btn.classList.add("active");

      currentEmotion =
        btn.dataset.emotion;

    };

  });

document
  .getElementById("mobileSave")
  .onclick = ()=>{

    saveDiary(

      document
        .getElementById("mobileTitle")
        .value,

      document
        .getElementById("mobileContent")
        .value

    );

  };

document
  .querySelectorAll(
    ".mobile-tab"
  )
  .forEach(tab=>{

    tab.onclick = ()=>{

      document
        .querySelectorAll(
          ".mobile-tab"
        )
        .forEach(t=>{

          t.classList.remove(
            "active"
          );

        });

      tab.classList.add(
        "active"
      );

      document
        .querySelectorAll(
          ".mobile-page"
        )
        .forEach(page=>{

          page.classList.remove(
            "active"
          );

        });

      document
        .getElementById(
          tab.dataset.page
        )
        .classList.add("active");

    };

  });

/* =========================================================
DESKTOP UI JS
========================================================= */

document
  .getElementById("desktopSave")
  .onclick = ()=>{

    saveDiary(

      document
        .getElementById("desktopTitle")
        .value,

      document
        .getElementById("desktopContent")
        .value

    );

  };

/* =========================================================
RENDER
========================================================= */

function renderMobileFeed(){

  const feed =
    document.getElementById(
      "mobileFeed"
    );

  feed.innerHTML =
    diaries
      .map(d=>`

        <div
          class="
            mobile-post
            glass
          "
        >

          <h3>

            ${
              emotionEmoji[
                d.emotion
              ]
            }

            ${d.title}

          </h3>

          <p
            style="
              margin-top:14px;
              line-height:1.9;
            "
          >

            ${d.content}

          </p>

        </div>

      `)
      .join("");

}

function renderDesktopFeed(){

  const feed =
    document.getElementById(
      "desktopFeed"
    );

  feed.innerHTML =
    diaries
      .map(d=>`

        <div
          class="
            desktop-post
            glass
          "
        >

          <h3>

            ${
              emotionEmoji[
                d.emotion
              ]
            }

            ${d.title}

          </h3>

          <p
            style="
              margin-top:14px;
              line-height:1.8;
            "
          >

            ${
              d.content
                .slice(0,120)
            }

          </p>

        </div>

      `)
      .join("");

}

function renderCalendar(){

  const mobileCal =
    document.getElementById(
      "mobileCalendar"
    );

  const desktopCal =
    document.getElementById(
      "desktopCalendar"
    );

  mobileCal.innerHTML = "";
  desktopCal.innerHTML = "";

  for(let i=1;i<=31;i++){

    const diary =
      diaries[i-1];

    mobileCal.innerHTML += `

      <div
        class="
          mobile-day
          glass
          ${
            diary
            ? `emotion-${diary.emotion}`
            : ""
          }
        "
      >

        ${i}

      </div>

    `;

    desktopCal.innerHTML += `

      <div
        class="
          desktop-day
          glass
          ${
            diary
            ? `emotion-${diary.emotion}`
            : ""
          }
        "
      >

        ${i}

      </div>

    `;

  }

}

function renderStats(){

  document
    .getElementById("mobileCount")
    .innerText =
    diaries.length;

  const emotionCount = {};

  diaries.forEach(d=>{

    emotionCount[d.emotion] =
      (emotionCount[d.emotion] || 0) + 1;

  });

  const best =
    Object.keys(emotionCount)[0]
    || "happy";

  document
    .getElementById("mobileBestEmotion")
    .innerText =
    emotionEmoji[best];

  document
    .getElementById("desktopEmotion")
    .innerText =
    emotionEmoji[best];

}

function renderSummary(){

  if(!diaries.length) return;

  document
    .getElementById("desktopSummary")
    .innerText =
    diaries[0].summary;

}

function renderRecent(){

  if(!diaries.length) return;

  document
    .getElementById("mobileRecent")
    .innerHTML = `

      <div
        style="
          margin-top:12px;
          line-height:1.8;
        "
      >

        ${
          emotionEmoji[
            diaries[0].emotion
          ]
        }

        ${diaries[0].title}

      </div>

    `;

  document
    .getElementById(
      "mobileTodayEmotion"
    )
    .innerText =
    emotionEmoji[
      diaries[0].emotion
    ];

}

function renderAll(){

  renderMobileFeed();

  renderDesktopFeed();

  renderCalendar();

  renderStats();

  renderSummary();

  renderRecent();

}

renderAll();

</script>

</body>
</html>
