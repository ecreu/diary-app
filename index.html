<!-- =========================
     DEBUG TOGGLE BUTTON
========================= -->

<button id="debug-toggle">
  🐞
</button>

<!-- =========================
     DEBUG CONSOLE
========================= -->

<div id="debug-log"></div>

<style>

/* =========================
   debug toggle
========================= */

#debug-toggle{

  position:fixed;

  top:14px;
  right:14px;

  width:42px;
  height:42px;

  border:none;

  border-radius:50%;

  background:
    rgba(0,0,0,.7);

  color:#7CFF7C;

  font-size:18px;

  z-index:1000000;

  backdrop-filter:
    blur(10px);

  cursor:pointer;
}

/* =========================
   debug console
========================= */

#debug-log{

  position:fixed;

  bottom:0;
  left:0;

  width:100%;

  max-height:35vh;

  overflow-y:auto;

  background:
    rgba(0,0,0,.85);

  color:#7CFF7C;

  font-size:12px;

  line-height:1.5;

  padding:
    10px
    10px
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  z-index:999999;

  backdrop-filter:
    blur(10px);

  font-family:monospace;

  border-top:
    1px solid rgba(
      255,255,255,.08
    );
}

#debug-log.hidden{
  display:none;
}

#debug-log p{

  margin:4px 0;

  word-break:break-word;
}

.debug-info{
  color:#7CFF7C;
}

.debug-error{
  color:#ff7c7c;
}

.debug-warn{
  color:#ffd36e;
}

</style>

<script>

/* =========================
   debug state
========================= */

const DEBUG_MAX_LOGS = 100;

let debugVisible = true;

/* =========================
   debug function
========================= */

function debug(
  message,
  type = "info"
){

  try{

    console.log(message);

    const log =
      document.getElementById(
        "debug-log"
      );

    if(!log){
      return;
    }

    const time =
      new Date()
        .toLocaleTimeString(
          "ko-KR"
        );

    const line =
      document.createElement(
        "p"
      );

    line.className =
      "debug-" + type;

    line.textContent =
      `[${time}] ${message}`;

    log.appendChild(line);

    /* 최대 로그 제한 */

    while(
      log.children.length >
      DEBUG_MAX_LOGS
    ){

      log.removeChild(
        log.firstChild
      );
    }

    log.scrollTop =
      log.scrollHeight;

  }catch(error){

    console.error(
      "debug render failed",
      error
    );
  }

}

/* =========================
   debug toggle
========================= */

function setupDebugToggle(){

  debug(
    "ENTER setupDebugToggle"
  );

  const toggle =
    document.getElementById(
      "debug-toggle"
    );

  const log =
    document.getElementById(
      "debug-log"
    );

  debug(
    "toggle exists: " +
    !!toggle
  );

  debug(
    "debug log exists: " +
    !!log
  );

  if(
    !toggle ||
    !log
  ){

    debug(
      "EXIT setupDebugToggle no element",
      "warn"
    );

    return;
  }

  toggle.addEventListener(
    "click",
    function(){

      debugVisible =
        !debugVisible;

      log.classList.toggle(
        "hidden",
        !debugVisible
      );

      debug(
        "DEBUG VISIBILITY: " +
        debugVisible
      );

    }
  );

  debug(
    "EXIT setupDebugToggle"
  );

}

/* =========================
   global error tracking
========================= */

window.addEventListener(
  "error",
  function(event){

    debug(
      "GLOBAL ERROR: " +
      event.message,
      "error"
    );

    debug(
      "LINE: " +
      event.lineno,
      "error"
    );

  }
);

window.addEventListener(
  "unhandledrejection",
  function(event){

    debug(
      "PROMISE ERROR: " +
      event.reason,
      "error"
    );

  }
);

/* =========================
   state
========================= */

const state = {
  entries:[]
};

/* =========================
   storage
========================= */

function loadEntries(){

  debug(
    "ENTER loadEntries"
  );

  try{

    const raw =
      localStorage.getItem(
        "entries"
      );

    debug(
      "storage raw exists: " +
      !!raw
    );

    if(!raw){

      debug(
        "EXIT loadEntries empty"
      );

      return [];
    }

    const parsed =
      JSON.parse(raw);

    debug(
      "parsed is array: " +
      Array.isArray(parsed)
    );

    if(
      !Array.isArray(parsed)
    ){

      debug(
        "EXIT loadEntries invalid",
        "warn"
      );

      return [];
    }

    debug(
      "EXIT loadEntries success"
    );

    return parsed;

  }catch(error){

    debug(
      "ERROR: " +
      error.message,
      "error"
    );

    console.error(error);

    return [];
  }

}

function saveEntries(){

  debug(
    "ENTER saveEntries"
  );

  try{

    localStorage.setItem(
      "entries",
      JSON.stringify(
        state.entries
      )
    );

    debug(
      "EXIT saveEntries"
    );

  }catch(error){

    debug(
      "ERROR: " +
      error.message,
      "error"
    );

    console.error(error);
  }

}

/* =========================
   utils
========================= */

function escapeHtml(text){

  debug(
    "ENTER escapeHtml"
  );

  try{

    const result =
      text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

    debug(
      "EXIT escapeHtml"
    );

    return result;

  }catch(error){

    debug(
      "ERROR: " +
      error.message,
      "error"
    );

    return text;
  }

}

/* =========================
   emotion
========================= */

function analyzeEmotion(text){

  debug(
    "ENTER analyzeEmotion"
  );

  try{

    const content =
      text.toLowerCase();

    if(
      content.includes("행복") ||
      content.includes("좋")
    ){

      debug(
        "EXIT analyzeEmotion 행복"
      );

      return {
        emoji:"😊",
        label:"행복"
      };
    }

    if(
      content.includes("슬")
    ){

      debug(
        "EXIT analyzeEmotion 슬픔"
      );

      return {
        emoji:"😢",
        label:"슬픔"
      };
    }

    debug(
      "EXIT analyzeEmotion 평범"
    );

    return {
      emoji:"😐",
      label:"평범"
    };

  }catch(error){

    debug(
      "ERROR: " +
      error.message,
      "error"
    );

    return {
      emoji:"😐",
      label:"평범"
    };
  }

}

/* =========================
   summary
========================= */

function createSummary(emotion){

  debug(
    "ENTER createSummary"
  );

  const summaries = {

    행복:
      "오늘은 따뜻한 하루였어요.",

    슬픔:
      "조금 지친 하루였네요.",

    평범:
      "소소한 하루였어요."
  };

  debug(
    "EXIT createSummary"
  );

  return summaries[
    emotion.label
  ] || summaries.평범;

}

/* =========================
   layout
========================= */

function createLayout(){

  debug(
    "ENTER createLayout"
  );

  try{

    const app =
      document.getElementById(
        "app"
      );

    debug(
      "app exists: " +
      !!app
    );

    if(!app){

      debug(
        "EXIT createLayout no app",
        "warn"
      );

      return;
    }

    app.innerHTML = `

      <div class="mobile-app">

        <header class="header">

          <h1>
            하루 일기
          </h1>

          <p>
            오늘 하루를 기록해보세요
          </p>

        </header>

        <section class="card">

          <input
            id="titleInput"
            class="input"
            placeholder="제목"
          />

          <textarea
            id="contentInput"
            class="textarea"
            placeholder="오늘 하루는 어땠나요?"
          ></textarea>

          <button
            id="saveBtn"
            class="save-btn"
          >
            작성 완료
          </button>

        </section>

        <section
          id="timeline"
          class="timeline"
        ></section>

      </div>

    `;

    debug(
      "LAYOUT CREATED"
    );

    debug(
      "EXIT createLayout"
    );

  }catch(error){

    debug(
      "ERROR: " +
      error.message,
      "error"
    );

    console.error(error);
  }

}

/* =========================
   timeline
========================= */

function renderTimeline(){

  debug(
    "ENTER renderTimeline"
  );

  try{

    debug(
      "TIMELINE RENDER START"
    );

    const timeline =
      document.getElementById(
        "timeline"
      );

    debug(
      "timeline exists: " +
      !!timeline
    );

    if(!timeline){

      debug(
        "EXIT renderTimeline no timeline",
        "warn"
      );

      return;
    }

    if(
      state.entries.length === 0
    ){

      timeline.innerHTML = `

        <div class="card empty">
          아직 작성된 일기가 없어요.
        </div>

      `;

      debug(
        "TIMELINE EMPTY"
      );

      debug(
        "TIMELINE RENDER END"
      );

      debug(
        "EXIT renderTimeline"
      );

      return;
    }

    timeline.innerHTML =

      state.entries
        .slice()
        .reverse()
        .map(entry => `

          <article class="entry">

            <div class="entry-title">

              ${entry.emotion.emoji}
              ${escapeHtml(
                entry.title
              )}

            </div>

            <div class="entry-date">

              ${entry.createdAt}

            </div>

            <div class="entry-content">

              ${escapeHtml(
                entry.content
              )}

            </div>

            <div class="entry-summary">

              ${entry.summary}

            </div>

          </article>

        `)
        .join("");

    debug(
      "TIMELINE RENDER END"
    );

    debug(
      "EXIT renderTimeline"
    );

  }catch(error){

    debug(
      "ERROR: " +
      error.message,
      "error"
    );

    console.error(error);
  }

}

/* =========================
   save
========================= */

function saveEntry(){

  debug(
    "ENTER saveEntry"
  );

  try{

    const titleInput =
      document.getElementById(
        "titleInput"
      );

    const contentInput =
      document.getElementById(
        "contentInput"
      );

    debug(
      "titleInput exists: " +
      !!titleInput
    );

    debug(
      "contentInput exists: " +
      !!contentInput
    );

    if(
      !titleInput ||
      !contentInput
    ){

      debug(
        "EXIT saveEntry missing input",
        "warn"
      );

      return;
    }

    const title =
      titleInput.value.trim();

    const content =
      contentInput.value.trim();

    debug(
      "content length: " +
      content.length
    );

    if(!content){

      debug(
        "EXIT saveEntry empty",
        "warn"
      );

      return;
    }

    const emotion =
      analyzeEmotion(content);

    const entry = {

      id:Date.now(),

      title:
        title ||
        "제목 없는 일기",

      content,

      createdAt:
        new Date()
          .toLocaleString(
            "ko-KR"
          ),

      emotion,

      summary:
        createSummary(
          emotion
        )
    };

    state.entries.push(
      entry
    );

    debug(
      "entry pushed"
    );

    saveEntries();

    renderTimeline();

    titleInput.value = "";
    contentInput.value = "";

    debug(
      "EXIT saveEntry"
    );

  }catch(error){

    debug(
      "ERROR: " +
      error.message,
      "error"
    );

    console.error(error);
  }

}

/* =========================
   events
========================= */

function attachEvents(){

  debug(
    "ENTER attachEvents"
  );

  try{

    const saveBtn =
      document.getElementById(
        "saveBtn"
      );

    debug(
      "saveBtn exists: " +
      !!saveBtn
    );

    if(!saveBtn){

      debug(
        "EXIT attachEvents no button",
        "warn"
      );

      return;
    }

    saveBtn.addEventListener(
      "click",
      saveEntry
    );

    debug(
      "EVENT ATTACHED"
    );

    debug(
      "EXIT attachEvents"
    );

  }catch(error){

    debug(
      "ERROR: " +
      error.message,
      "error"
    );

    console.error(error);
  }

}

/* =========================
   init
========================= */

function initApp(){

  debug(
    "INIT START"
  );

  try{

    createLayout();

    state.entries =
      loadEntries();

    debug(
      "STORAGE LOADED"
    );

    renderTimeline();

    attachEvents();

    setupDebugToggle();

    debug(
      "INIT COMPLETE"
    );

  }catch(error){

    debug(
      "ERROR: " +
      error.message,
      "error"
    );

    console.error(error);
  }

}

/* =========================
   start
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    debug(
      "DOMContentLoaded"
    );

    initApp();

  }
);

</script>
