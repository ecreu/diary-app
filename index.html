<style>

/* =========================================================
MOBILE NATURAL FLOW CSS
========================================================= */

body.mobile{

  min-height:100vh;

  overflow-x:hidden;
  overflow-y:auto;

  -webkit-overflow-scrolling:touch;

  padding-bottom:150px;
}

/* =========================================================
ROOT
========================================================= */

.mobile-shell{

  width:100%;

  max-width:560px;

  margin:0 auto;

  padding:
    calc(env(safe-area-inset-top) + 18px)
    16px
    170px;

  display:flex;

  flex-direction:column;

  gap:24px;

  overflow:visible;

  position:relative;
}

/* =========================================================
HEADER
========================================================= */

.mobile-header{

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.mobile-logo{

  font-size:30px;

  font-weight:700;
}

.mobile-theme-btn{

  width:52px;
  height:52px;

  border:none;

  border-radius:18px;
}

/* =========================================================
PAGE
========================================================= */

.mobile-page{

  display:none;

  width:100%;

  overflow:visible;
}

.mobile-page.active{

  display:flex;

  flex-direction:column;

  gap:22px;

  animation:
    mobileFade .45s cubic-bezier(.22,1,.36,1);
}

@keyframes mobileFade{

  from{
    opacity:0;
    transform:translateY(16px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* =========================================================
CARD
========================================================= */

.mobile-card{

  border-radius:34px;

  padding:24px;

  position:relative;

  overflow:hidden;
}

.mobile-card::before{

  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.12),
      transparent
    );

  pointer-events:none;
}

/* =========================================================
TODAY
========================================================= */

.mobile-emotion-big{

  font-size:58px;

  margin-top:14px;
}

.mobile-subtext{

  margin-top:12px;

  line-height:1.7;

  color:var(--sub);
}

/* =========================================================
CALENDAR FLOW
========================================================= */

.mobile-calendar-section{

  width:100%;

  position:relative;

  overflow:visible;

  height:auto;
}

.mobile-calendar-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:22px;
}

.mobile-calendar-btn{

  width:46px;
  height:46px;

  border:none;

  border-radius:16px;
}

/* =========================================================
WEEK
========================================================= */

.mobile-week-row{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  margin-bottom:12px;

  opacity:.55;

  text-align:center;

  font-size:13px;
}

/* =========================================================
CALENDAR
========================================================= */

.mobile-calendar{

  width:100%;

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:10px;

  overflow:visible;

  position:relative;

  transition:
    transform .45s cubic-bezier(.22,1,.36,1),
    opacity .35s ease;
}

.mobile-day{

  aspect-ratio:1/1;

  border-radius:22px;

  display:flex;

  justify-content:center;
  align-items:center;

  position:relative;

  font-size:14px;

  transition:
    transform .25s ease,
    background .25s ease;
}

.mobile-day:active{

  transform:scale(.94);
}

.mobile-dot{

  width:7px;
  height:7px;

  border-radius:50%;

  position:absolute;

  bottom:10px;
}

/* =========================================================
FEED
========================================================= */

.mobile-feed-section{

  width:100%;
}

.mobile-feed-title{

  font-size:20px;

  font-weight:700;

  margin-bottom:16px;
}

.mobile-feed{

  display:flex;

  flex-direction:column;

  gap:18px;

  overflow:visible;
}

.mobile-post{

  border-radius:30px;

  padding:22px;

  animation:
    postFade .55s cubic-bezier(.22,1,.36,1);
}

@keyframes postFade{

  from{
    opacity:0;
    transform:
      translateY(24px);
  }

  to{
    opacity:1;
    transform:
      translateY(0);
  }

}

.mobile-post img{

  width:100%;

  border-radius:24px;

  margin-top:16px;

  display:block;
}

/* =========================================================
WRITE
========================================================= */

.mobile-input{

  width:100%;

  border:none;

  outline:none;

  background:
    rgba(255,255,255,.2);

  border-radius:24px;

  padding:18px;

  color:var(--text);

  margin-top:14px;
}

.mobile-textarea{

  min-height:240px;

  line-height:1.9;

  resize:none;

  overflow:hidden;
}

/* =========================================================
EMOTIONS
========================================================= */

.mobile-emotions{

  display:flex;

  gap:10px;

  overflow-x:auto;

  margin-top:18px;

  padding-bottom:2px;
}

.mobile-emotion{

  border:none;

  border-radius:999px;

  padding:12px 16px;

  min-width:max-content;

  transition:
    transform .25s ease,
    background .25s ease;
}

.mobile-emotion.active{

  background:#111;

  color:white;

  transform:scale(1.04);
}

body.dark .mobile-emotion.active{

  background:white;

  color:#111;
}

/* =========================================================
SAVE BUTTON
========================================================= */

.mobile-save{

  position:fixed;

  right:22px;
  bottom:112px;

  width:66px;
  height:66px;

  border:none;

  border-radius:50%;

  font-size:30px;

  z-index:999;

  transition:
    transform .25s ease;
}

.mobile-save:active{

  transform:scale(.92);
}

/* =========================================================
TABBAR
========================================================= */

.mobile-tabbar{

  position:fixed;

  left:50%;
  bottom:18px;

  transform:translateX(-50%);

  width:92%;

  max-width:520px;

  height:84px;

  border-radius:34px;

  display:flex;

  justify-content:space-around;

  align-items:center;

  z-index:9999;
}

.mobile-tab{

  width:64px;
  height:64px;

  border:none;

  border-radius:24px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:4px;

  color:var(--sub);

  transition:
    transform .25s ease,
    background .25s ease;
}

.mobile-tab.active{

  background:
    rgba(255,255,255,.18);

  color:var(--text);

  transform:
    translateY(-8px);

  box-shadow:
    0 0 30px rgba(255,255,255,.16);
}

/* =========================================================
STATS
========================================================= */

.mobile-stats{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:16px;
}

.mobile-stat{

  border-radius:30px;

  padding:24px;

  text-align:center;
}

/* =========================================================
REMOVE OLD SCROLL SYSTEM
중요
========================================================= */

.mobile-calendar-wrapper,
.mobile-scroll-container,
.mobile-inner-scroll{

  overflow:visible !important;

  height:auto !important;

  max-height:none !important;

  position:relative !important;
}

/* sticky 제거 */

.mobile-calendar-section,
.mobile-feed-section,
.mobile-page{

  position:relative !important;

  top:auto !important;

  bottom:auto !important;
}

</style>
