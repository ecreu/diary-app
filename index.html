<script>

/* =========================================================
REMOVE OLD PIN STORAGE
앱 시작 시 기존 PIN 데이터 제거
========================================================= */

localStorage.removeItem(
  "diaryPin"
);

localStorage.removeItem(
  "enteredPin"
);

localStorage.removeItem(
  "hasPin"
);

localStorage.removeItem(
  "pinEnabled"
);

/* =========================================================
APP INIT
PIN 없이 바로 실행
========================================================= */

loadEntries();

renderCurrentPlatform();

/* 기존 제거 */
//
// initPin();
//

window.addEventListener(
  "resize",
  renderCurrentPlatform
);

</script>

<!-- =========================================================
6. renderCurrentPlatform 안정화
========================================================= -->

<script>

/* =========================================================
SAFE PLATFORM RENDER
========================================================= */

function renderCurrentPlatform(){

  const platform =
    detectPlatform();

  currentPlatform =
    platform;

  requestAnimationFrame(()=>{

    if(platform === "mobile"){

      renderMobileApp();
    }

    else{

      renderDesktopApp();
    }

  });

}

</script>

<!-- =========================================================
7. 모바일 저장 버튼 안정화
========================================================= -->

<script>

/* =========================================================
MOBILE EVENT REBIND
========================================================= */

function registerMobileEvents(){

  const saveBtn =
    document.getElementById(
      "mobileSave"
    );

  if(!saveBtn) return;

  saveBtn.onpointerdown =
    null;

  saveBtn.ontouchstart =
    null;

  saveBtn.addEventListener(
    "pointerdown",
    saveEntry,
    {
      passive:true
    }
  );

}

</script>
