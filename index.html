<script>

/* =========================
   createLayout
========================= */

function createLayout(){

  debug(
    "ENTER createLayout"
  );

  try{

    /* -------------------------
       app 확인
    ------------------------- */

    const app =
      document.getElementById(
        "app"
      );

    debug(
      "app exists: " +
      !!app
    );

    if(!app){

      debug(
        "APP NOT FOUND"
      );

      return;
    }

    /* -------------------------
       최소 layout 생성
    ------------------------- */

    const layout = `

      <div class="mobile-app">

        <div
          style="
            color:white;
            margin-bottom:20px;
            font-size:20px;
          "
        >
          APP WORKING
        </div>

        <button
          class="save-btn"
          id="saveBtn"
        >
          저장
        </button>

        <div
          class="timeline"
          id="timeline"
          style="
            margin-top:20px;
            color:white;
          "
        >
          TIMELINE
        </div>

      </div>

    `;

    /* -------------------------
       layout 반환값 검사
    ------------------------- */

    debug(
      "layout exists: " +
      !!layout
    );

    debug(
      "layout length: " +
      layout.length
    );

    /* -------------------------
       DOM 삽입
    ------------------------- */

    app.innerHTML =
      layout;

    debug(
      "LAYOUT INSERTED"
    );

    /* -------------------------
       DOM 생성 확인
    ------------------------- */

    debug(
      "app children: " +
      app.children.length
    );

    const timeline =
      document.getElementById(
        "timeline"
      );

    const saveBtn =
      document.getElementById(
        "saveBtn"
      );

    debug(
      "timeline exists after insert: " +
      !!timeline
    );

    debug(
      "saveBtn exists after insert: " +
      !!saveBtn
    );

    debug(
      "EXIT createLayout"
    );

  }catch(error){

    debug(
      "LAYOUT ERROR: " +
      error.message
    );

    console.error(error);

    const app =
      document.getElementById(
        "app"
      );

    if(app){

      app.innerHTML = `

        <div
          style="
            padding:20px;
            color:red;
          "
        >
          LAYOUT ERROR
        </div>

      `;
    }

  }

}

/* =========================
   init
========================= */

function initApp(){

  debug(
    "INIT START"
  );

  /* -------------------------
     1. layout 생성
  ------------------------- */

  createLayout();

  debug(
    "AFTER createLayout"
  );

  /* -------------------------
     2. storage
  ------------------------- */

  state.entries =
    loadEntries();

  debug(
    "STORAGE LOADED"
  );

  /* -------------------------
     3. timeline render
  ------------------------- */

  renderTimeline();

  debug(
    "TIMELINE RENDER END"
  );

  /* -------------------------
     4. events
  ------------------------- */

  attachEvents();

  debug(
    "EVENT ATTACHED"
  );

  debug(
    "INIT COMPLETE"
  );

}

</script>
