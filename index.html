<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1,
    viewport-fit=cover
  "
/>

<title>하루 일기</title>

<style>

/* =========================
   reset
========================= */

:root{

  --bg1:#0f172a;
  --bg2:#1e293b;

  --card:
    rgba(255,255,255,.08);

  --line:
    rgba(255,255,255,.08);

  --text:#f8fafc;

  --sub:#cbd5e1;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:
    transparent;
}

html,
body{

  width:100%;
  min-height:100dvh;

  overflow-x:hidden;

  background:
    linear-gradient(
      180deg,
      var(--bg2),
      var(--bg1)
    );

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
}

body{
  padding-bottom:
    env(safe-area-inset-bottom);
}

/* =========================
   app
========================= */

#app{
  width:100%;
  min-height:100dvh;
}

.mobile-app{

  width:100%;

  min-height:100dvh;

  padding:
    24px
    16px
    180px;
}

/* =========================
   header
========================= */

.header{
  margin-bottom:24px;
}

.header h1{
  font-size:32px;
  margin-bottom:6px;
}

.header p{
  color:var(--sub);
  font-size:14px;
}

/* =========================
   card
========================= */

.card{

  background:
    rgba(255,255,255,.08);

  border:
    1px solid rgba(
      255,255,255,.08
    );

  border-radius:28px;

  backdrop-filter:
    blur(14px);

  padding:18px;

  margin-bottom:18px;
}

/* =========================
   inputs
========================= */

.input{

  width:100%;

  border:none;
  outline:none;

  background:
    rgba(255,255,255,.05);

  color:white;

  border-radius:18px;

  padding:14px;

  margin-bottom:12px;
}

.textarea{

  width:100%;

  min-height:180px;

  resize:none;

  border:none;
  outline:none;

  background:
    rgba(255,255,255,.05);

  color:white;

  border-radius:22px;

  padding:16px;

  line-height:1.7;
}

.save-btn{

  width:100%;

  height:56px;

  border:none;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #6366f1
    );

  color:white;

  font-weight:700;

  margin-top:14px;

  cursor:pointer;
}

/* =========================
   timeline
========================= */

.timeline{

  display:flex;

  flex-direction:column;

  gap:14px;
}

.entry{

  background:
    rgba(255,255,255,.06);

  border:
    1px solid rgba(
      255,255,255,.06
    );

  border-radius:24px;

  padding:18px;
}

.entry-title{

  font-size:18px;

  font-weight:700;

  margin-bottom:8px;
}

.entry-date{

  color:var(--sub);

  font-size:12px;

  margin-bottom:12px;
}

.entry-content{

  line-height:1.7;

  color:#e2e8f0;

  white-space:pre-wrap;

  word-break:break-word;
}

.entry-summary{

  margin-top:12px;

  color:#c4b5fd;

  font-size:13px;
}

.empty{

  text-align:center;

  color:var(--sub);

  padding:26px 0;
}

/* =========================
   debug toggle
========================= */

#debug-toggle{

  position:fixed;

  top:14px;
  right:14px;

  width:42px;
  height:42px;

  border:none;

  border-radius:50%;

  background:
    rgba(0,0,0,.7);

  color:#7CFF7C;

  font-size:18px;

  z-index:1000000;

  backdrop-filter:
    blur(10px);
}

/* =========================
   debug console
========================= */

#debug-log{

  position:fixed;

  left:0;
  bottom:0;

  width:100%;

  max-height:35vh;

  overflow-y:auto;

  background:
    rgba(0,0,0,.85);

  color:#7CFF7C;

  font-size:12px;

  line-height:1.5;

  padding:
    10px
    10px
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  z-index:999999;

  backdrop-filter:
    blur(10px);

  font-family:monospace;
}

#debug-log.hidden{
  display:none;
}

#debug-log p{
  margin:4px 0;
  word-break:break-word;
}

</style>
</head>

<body>

<div id="app"></div>

<button id="debug-toggle">
  🐞
</button>

<div id="debug-log"></div>

<script>

/* =========================
   debug
========================= */

const DEBUG_MAX_LOGS = 100;

let debugVisible = true;

function debug(message){

  console.log(message);

  const log =
    document.getElementById(
      "debug-log"
    );

  if(!log){
    return;
  }

  const time =
    new Date()
      .toLocaleTimeString(
        "ko-KR"
      );

  const line =
    document.createElement("p");

  line.textContent =
    "[" + time + "] " +
    message;

  log.appendChild(line);

  while(
    log.children.length >
    DEBUG_MAX_LOGS
  ){

    log.removeChild(
      log.firstChild
    );
  }

  log.scrollTop =
    log.scrollHeight;
}

/* =========================
   global error
========================= */

window.addEventListener(
  "error",
  function(event){

    debug(
      "GLOBAL ERROR: " +
      event.message
    );
  }
);

window.addEventListener(
  "unhandledrejection",
  function(event){

    debug(
      "PROMISE ERROR: " +
      event.reason
    );
  }
);

/* =========================
   state
========================= */

const state = {
  entries:[]
};

/* =========================
   storage
========================= */

function loadEntries(){

  debug(
    "ENTER loadEntries"
  );

  try{

    const raw =
      localStorage.getItem(
        "entries"
      );

    if(!raw){

      debug(
        "EXIT loadEntries empty"
      );

      return [];
    }

    const parsed =
      JSON.parse(raw);

    if(
      !Array.isArray(parsed)
    ){

      debug(
        "EXIT loadEntries invalid"
      );

      return [];
    }

    debug(
      "EXIT loadEntries success"
    );

    return parsed;

  }catch(error){

    debug(
      "ERROR: " +
      error.message
    );

    return [];
  }

}

function saveEntries(){

  debug(
    "ENTER saveEntries"
  );

  try{

    localStorage.setItem(
      "entries",
      JSON.stringify(
        state.entries
      )
    );

    debug(
      "EXIT saveEntries"
    );

  }catch(error){

    debug(
      "ERROR: " +
      error.message
    );
  }

}

/* =========================
   emotion
========================= */

function analyzeEmotion(text){

  debug(
    "ENTER analyzeEmotion"
  );

  const content =
    text.toLowerCase();

  if(
    content.includes("행복") ||
    content.includes("좋")
  ){

    return {
      emoji:"😊",
      label:"행복"
    };
  }

  if(
    content.includes("슬")
  ){

    return {
      emoji:"😢",
      label:"슬픔"
    };
  }

  return {
    emoji:"😐",
    label:"평범"
  };

}

function createSummary(emotion){

  const summaries = {

    행복:
      "오늘은 따뜻한 하루였어요.",

    슬픔:
      "조금 지친 하루였네요.",

    평범:
      "소소한 하루였어요."
  };

  return summaries[
    emotion.label
  ] || summaries.평범;

}

/* =========================
   utils
========================= */

function escapeHtml(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

/* =========================
   layout
========================= */

function createLayout(){

  debug(
    "ENTER createLayout"
  );

  const app =
    document.getElementById(
      "app"
    );

  debug(
    "app exists: " +
    !!app
  );

  if(!app){
    return;
  }

  app.innerHTML = `

    <div class="mobile-app">

      <header class="header">

        <h1>
          하루 일기
        </h1>

        <p>
          오늘 하루를 기록해보세요
        </p>

      </header>

      <section class="card">

        <input
          id="titleInput"
          class="input"
          placeholder="제목"
        />

        <textarea
          id="contentInput"
          class="textarea"
          placeholder="오늘 하루는 어땠나요?"
        ></textarea>

        <button
          id="saveBtn"
          class="save-btn"
        >
          작성 완료
        </button>

      </section>

      <section
        id="timeline"
        class="timeline"
      ></section>

    </div>

  `;

  debug(
    "LAYOUT CREATED"
  );

}

/* =========================
   timeline
========================= */

function renderTimeline(){

  debug(
    "ENTER renderTimeline"
  );

  const timeline =
    document.getElementById(
      "timeline"
    );

  debug(
    "timeline exists: " +
    !!timeline
  );

  if(!timeline){
    return;
  }

  if(
    state.entries.length === 0
  ){

    timeline.innerHTML = `

      <div class="card empty">
        아직 작성된 일기가 없어요.
      </div>

    `;

    debug(
      "TIMELINE EMPTY"
    );

    return;
  }

  timeline.innerHTML =

    state.entries
      .slice()
      .reverse()
      .map(function(entry){

        return `

          <article class="entry">

            <div class="entry-title">

              ${entry.emotion.emoji}
              ${escapeHtml(
                entry.title
              )}

            </div>

            <div class="entry-date">

              ${entry.createdAt}

            </div>

            <div class="entry-content">

              ${escapeHtml(
                entry.content
              )}

            </div>

            <div class="entry-summary">

              ${entry.summary}

            </div>

          </article>

        `;

      })
      .join("");

  debug(
    "EXIT renderTimeline"
  );

}

/* =========================
   save
========================= */

function saveEntry(){

  debug(
    "ENTER saveEntry"
  );

  try{

    const titleInput =
      document.getElementById(
        "titleInput"
      );

    const contentInput =
      document.getElementById(
        "contentInput"
      );

    debug(
      "title exists: " +
      !!titleInput
    );

    debug(
      "content exists: " +
      !!contentInput
    );

    if(
      !titleInput ||
      !contentInput
    ){
      return;
    }

    const title =
      titleInput.value.trim();

    const content =
      contentInput.value.trim();

    if(!content){

      debug(
        "EMPTY CONTENT"
      );

      return;
    }

    const emotion =
      analyzeEmotion(
        content
      );

    const entry = {

      id:Date.now(),

      title:
        title ||
        "제목 없는 일기",

      content,

      createdAt:
        new Date()
          .toLocaleString(
            "ko-KR"
          ),

      emotion,

      summary:
        createSummary(
          emotion
        )
    };

    state.entries.push(
      entry
    );

    debug(
      "ENTRY PUSHED"
    );

    saveEntries();

    renderTimeline();

    titleInput.value = "";
    contentInput.value = "";

    debug(
      "EXIT saveEntry"
    );

  }catch(error){

    debug(
      "ERROR: " +
      error.message
    );
  }

}

/* =========================
   events
========================= */

function attachEvents(){

  debug(
    "ENTER attachEvents"
  );

  const saveBtn =
    document.getElementById(
      "saveBtn"
    );

  debug(
    "saveBtn exists: " +
    !!saveBtn
  );

  if(!saveBtn){
    return;
  }

  saveBtn.addEventListener(
    "click",
    saveEntry
  );

  const toggle =
    document.getElementById(
      "debug-toggle"
    );

  const log =
    document.getElementById(
      "debug-log"
    );

  if(
    toggle &&
    log
  ){

    toggle.addEventListener(
      "click",
      function(){

        debugVisible =
          !debugVisible;

        log.classList.toggle(
          "hidden",
          !debugVisible
        );

      }
    );
  }

  debug(
    "EVENT ATTACHED"
  );

}

/* =========================
   init
========================= */

function initApp(){

  debug(
    "INIT START"
  );

  createLayout();

  state.entries =
    loadEntries();

  debug(
    "STORAGE LOADED"
  );

  renderTimeline();

  debug(
    "TIMELINE RENDER END"
  );

  attachEvents();

  debug(
    "INIT COMPLETE"
  );

}

/* =========================
   start
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    debug(
      "DOMContentLoaded"
    );

    initApp();

  }
);

</script>

</body>
</html>
